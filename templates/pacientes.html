{% extends "base.html" %}
{% block title %}Pacientes - NeuroAI{% endblock %}
{% block content %}

<div class="page-pacientes">
  <section class="page-header">
    <h1>🧍 Gerenciamento de Pacientes</h1>
  </section>

  <section class="form-section">
    <h2>Adicionar Novo Paciente</h2>

    <form id="formPaciente" class="form-modern">
      <div class="form-group">
        <label>Nome</label>
        <input type="text" id="nome" required>
      </div>
      <div class="form-group">
        <label>Idade</label>
        <input type="number" id="idade" required>
      </div>
      <div class="form-group">
        <label>CPF</label>
        <input type="text" id="cpf" required>
      </div>
      <div class="form-group">
        <label>Telefone</label>
        <input type="text" id="telefone" required>
      </div>
      <button type="submit" class="btn btn-success">+ Adicionar Paciente</button>
    </form>
  </section>

  <section class="cards-list">
    <h2>Pacientes Cadastrados</h2>
    <div id="pacientesContainer" class="cards-container"></div>
  </section>
</div>

<script src="{{ url_for('static', filename='js/pacientes.js') }}"></script>
{% endblock %}
