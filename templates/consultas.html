{% extends "base.html" %}
{% block title %}Consultas - NeuroAI{% endblock %}
{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/consulta.css') }}">
<script defer src="{{ url_for('static', filename='js/consulta.js') }}"></script>

<div class="page-consultas">
  <section class="page-header">
    <h1>📅 Gerenciamento de Consultas</h1>
  </section>

  <section class="form-section">
    <h2>Agendar Nova Consulta</h2>
    <form id="formConsulta" class="form-modern">
      <div class="form-group">
        <label for="data">Data</label>
        <input type="date" id="data" required>
      </div>

      <div class="form-group">
        <label for="hora">Hora</label>
        <input type="time" id="hora" required>
      </div>

      <div class="form-group">
        <label for="modalidade">Modalidade</label>
        <select id="modalidade">
          <option value="Presencial">Presencial</option>
          <option value="Online">Online</option>
        </select>
      </div>

      <div class="form-group">
        <label for="idPaciente">ID do Paciente</label>
        <input type="number" id="idPaciente" placeholder="Ex: 1" required>
      </div>

      <div class="form-group">
        <label for="idMedico">ID do Médico</label>
        <input type="number" id="idMedico" placeholder="Ex: 2" required>
      </div>

      <button type="submit" class="btn btn-primary center-btn">Agendar Consulta</button>
    </form>
  </section>

  <section class="cards-list">
    <h2>Consultas Agendadas</h2>
    <div id="listaConsultas" class="cards-container"></div>
  </section>
</div>

{% endblock %}
