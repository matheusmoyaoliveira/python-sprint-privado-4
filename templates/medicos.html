{% extends "base.html" %}
{% block title %}Médicos - NeuroAI{% endblock %}
{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/medico.css') }}">
<script defer src="{{ url_for('static', filename='js/medico.js') }}"></script>

<div class="page-medicos">
  <section class="page-header">
    <h1>🩺 Gerenciamento de Médicos</h1>
  </section>

  <section class="form-section">
    <h2>Adicionar Novo Médico</h2>

    <form id="formMedico" class="form-modern">
      <div class="form-group">
        <label for="nome">Nome do Médico</label>
        <input type="text" id="nome" placeholder="Ex: Dr. João Almeida Jr.">
      </div>

      <div class="form-group">
        <label for="crm">CRM</label>
        <input type="text" id="crm" placeholder="Ex: 12345">
      </div>

      <div class="form-group">
        <label for="especialidade">Especialidade</label>
        <select id="especialidade" name="especialidade" required>
            <option value="">Selecione uma especialidade</option>
            <option value="Cardiologia">Cardiologia</option>
            <option value="Neurologia">Neurologia</option>
            <option value="Ortopedia">Ortopedia</option>
            <option value="Dermatologia">Dermatologia</option>
            <option value="Pediatria">Pediatria</option>
            <option value="Psiquiatria">Psiquiatria</option>
            <option value="Endocrinologia">Endocrinologia</option>
            <option value="Ginecologia">Ginecologia</option>
            <option value="Urologia">Urologia</option>
            <option value="Oftalmologia">Oftalmologia</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary">+ Adicionar Médico</button>
    </form>
  </section>

  <section class="cards-list">
    <h2>Médicos Cadastrados</h2>
    <div id="listaMedicos" class="cards-container"></div>
  </section>
</div>

{% endblock %}
